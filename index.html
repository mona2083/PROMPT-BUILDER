
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #f0f0f0; color: #333; height: 100vh; overflow: hidden; }

  .header { background: #1a1a2e; height: 56px; display: flex;
            align-items: center; padding: 0 20px;
            justify-content: space-between; flex-shrink: 0; }
  .header h1 { color: #fff; font-size: 18px; font-weight: 700; }
  .header-btns { display: flex; gap: 8px; }
  .header-btns button { background: #e0e0e0; color: #1a1a2e;
    border: none; border-radius: 6px; padding: 6px 14px;
    cursor: pointer; font-size: 13px; font-weight: 500; }
  .header-btns button:hover { background: #cccccc; }
  .profile-btn { background: #4a90d9 !important; color: #fff !important; }
  .profile-btn:hover { background: #357abd !important; }

  .tabs { background: #e8e8e8; display: flex; gap: 8px;
          padding: 7px 12px; flex-shrink: 0; overflow-x: auto; }
  .tab-btn { border: none; border-radius: 6px; padding: 7px 18px;
             cursor: pointer; font-size: 13px; font-weight: 500;
             background: #d0d0d0; color: #555; white-space: nowrap; }
  .tab-btn.active { background: #4a90d9; color: #fff; }
  .tab-btn:hover:not(.active) { background: #bbbbbb; }

  .main { display: grid; grid-template-columns: 1fr 1fr;
          gap: 16px; padding: 16px;
          height: calc(100vh - 112px); }

  .card { background: #fff; border-radius: 10px;
          padding: 16px; display: flex; flex-direction: column;
          overflow: hidden; }

  /* プロフィールバッジ */
  .profile-badge { display: flex; align-items: center; gap: 8px;
    background: #e8f0f8; border-radius: 6px; padding: 6px 10px;
    margin-bottom: 10px; font-size: 12px; color: #357abd;
    border: 1px solid #b8d4ee; flex-shrink: 0; }
  .profile-badge span { flex: 1; }
  .profile-badge-edit { background: transparent; border: none;
    color: #4a90d9; cursor: pointer; font-size: 12px;
    padding: 2px 6px; border-radius: 4px; }
  .profile-badge-edit:hover { background: #d0e4f4; }

  /* プリセットバー */
  .preset-bar { display: flex; gap: 8px; align-items: center;
                padding: 8px 0 10px; border-bottom: 1px solid #eee;
                margin-bottom: 8px; flex-shrink: 0; }
  .preset-select { flex: 1; border: 1px solid #ddd;
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
    background: #f9f9f9; color: #333; outline: none; cursor: pointer; }
  .preset-select:focus { border-color: #4a90d9; }
  .preset-btn { border: none; border-radius: 6px; padding: 6px 12px;
    cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .preset-btn-save { background: #4a90d9; color: #fff; }
  .preset-btn-save:hover { background: #357abd; }
  .preset-btn-del { background: #f5f5f5; color: #cc4444;
                    border: 1px solid #eee; }
  .preset-btn-del:hover { background: #ffeeee; }

  .form-title { font-size: 14px; font-weight: 700;
                color: #333; margin-bottom: 4px; flex-shrink: 0; }
  .field-label { font-size: 12px; font-weight: 600;
                 color: #444; margin: 8px 0 3px; }
  .field-input { width: 100%; border: 1px solid #ddd;
    border-radius: 6px; padding: 7px 10px;
    font-size: 12px; font-family: inherit;
    background: #f9f9f9; color: #222;
    resize: vertical; outline: none; }
  .field-input:focus { border-color: #4a90d9; background: #fff; }
  .field-input.placeholder { color: #aaa; }
  .form-scroll { overflow-y: auto; flex: 1; }

  .option-row { display: flex; align-items: center;
                gap: 8px; padding: 6px 0 2px; flex-shrink: 0; }
  .option-row label { font-size: 12px; color: #444; cursor: pointer; }

  .send-btn { background: #4a90d9; color: #fff; border: none;
    border-radius: 8px; padding: 10px; font-size: 14px;
    font-weight: 700; cursor: pointer; margin-top: 6px;
    width: 100%; flex-shrink: 0; }
  .send-btn:hover { background: #357abd; }
  .send-btn:disabled { background: #aaa; cursor: not-allowed; }

  /* 右パネル */
  .right-panel { display: flex; flex-direction: column; gap: 8px; }

  .output-header { display: flex; justify-content: space-between;
                   align-items: center; margin-bottom: 6px; flex-shrink: 0; }
  .output-label { font-size: 12px; font-weight: 700; color: #555; }
  .output-btns { display: flex; gap: 6px; }
  .output-btn { background: transparent; color: #4a90d9; border: none;
    cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 4px; }
  .output-btn:hover { background: #e8f0f8; }

  /* プロンプトボックス：右パネルの半分以上 */
  .prompt-section { flex: 3; display: flex; flex-direction: column;
                    min-height: 0; }
  .answer-section { flex: 2; display: flex; flex-direction: column;
                    min-height: 0; }

  .output-box { flex: 1; border: 1px solid #eee; border-radius: 6px;
    padding: 10px; font-size: 12px; line-height: 1.7;
    background: #f9f9f9; color: #444;
    overflow-y: auto; white-space: pre-wrap;
    word-break: break-word; }
  .answer-box { background: #fff; color: #222; }

  .status-bar { background: #e8e8e8; padding: 4px 16px;
                font-size: 11px; color: #888; height: 28px;
                line-height: 20px; flex-shrink: 0; }

  /* モーダル */
  .modal-overlay { display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px;
           width: 820px; max-width: 95vw;
           max-height: 80vh; display: flex;
           flex-direction: column; overflow: hidden; }
  .modal-header { background: #1a1a2e; padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center; }
  .modal-header h2 { color: #fff; font-size: 15px; }
  .modal-close { background: transparent; border: none;
    color: #fff; font-size: 20px; cursor: pointer; }
  .modal-body { overflow-y: auto; padding: 16px; flex: 1; }

  .history-card { background: #fff; border: 1px solid #ddd;
    border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .history-meta { font-size: 11px; color: #888; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center; }
  .history-meta-btns { display: flex; gap: 6px; }
  .history-preview { font-size: 12px; color: #444; line-height: 1.5; }
  .btn-use { background: transparent; color: #4a90d9; border: none;
    cursor: pointer; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  .btn-use:hover { background: #e8f0f8; }
  .btn-delete { background: transparent; color: #cc4444; border: none;
    cursor: pointer; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  .btn-delete:hover { background: #ffeeee; }
  .btn-danger { background: #cc4444; color: #fff; border: none;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .btn-danger:hover { background: #aa2222; }

  /* プロフィールモーダル */
  .profile-modal { width: 560px; }
  .profile-field-row { display: grid; grid-template-columns: 1fr 2fr;
    gap: 8px; align-items: center; margin-bottom: 10px; }
  .profile-field-label { font-size: 12px; font-weight: 600; color: #555; }
  .profile-field-input { border: 1px solid #ddd; border-radius: 6px;
    padding: 7px 10px; font-size: 13px; width: 100%; outline: none; }
  .profile-field-input:focus { border-color: #4a90d9; }
  .profile-divider { border: none; border-top: 1px solid #eee; margin: 16px 0; }
  .custom-field-row { display: flex; gap: 8px; align-items: center;
    margin-bottom: 8px; }
  .custom-field-del { background: transparent; color: #cc4444;
    border: none; cursor: pointer; font-size: 16px; }
  .add-custom-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-custom-input { flex: 1; border: 1px solid #ddd; border-radius: 6px;
    padding: 7px 10px; font-size: 13px; outline: none; }
  .add-custom-input:focus { border-color: #4a90d9; }
  .btn-add-custom { background: #4a90d9; color: #fff; border: none;
    border-radius: 6px; padding: 7px 14px; cursor: pointer;
    font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn-add-custom:hover { background: #357abd; }
  .profile-save-btn { background: #4a90d9; color: #fff; border: none;
    border-radius: 8px; padding: 10px; font-size: 14px;
    font-weight: 700; cursor: pointer; width: 100%; margin-top: 16px; }
  .profile-save-btn:hover { background: #357abd; }

  /* 設定モーダル */
  .settings-body { padding: 20px; }
  .settings-label { font-size: 13px; font-weight: 600;
                    color: #333; margin-bottom: 6px; }
  .settings-input { width: 100%; border: 1px solid #ddd;
    border-radius: 6px; padding: 8px 10px; font-size: 13px;
    margin-bottom: 16px; outline: none; }
  .settings-input:focus { border-color: #4a90d9; }
  .radio-group { display: flex; flex-direction: column;
                 gap: 8px; margin-bottom: 16px; }
  .radio-item { display: flex; align-items: center;
                gap: 8px; font-size: 13px; cursor: pointer; }
  .provider-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .provider-tab { border: 1px solid #ddd; border-radius: 6px;
    padding: 6px 16px; cursor: pointer; font-size: 13px;
    background: #f5f5f5; color: #555; }
  .provider-tab.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }
  .provider-section { display: none; }
  .provider-section.active { display: block; }
  .save-btn { background: #4a90d9; color: #fff; border: none;
    border-radius: 8px; padding: 10px; font-size: 14px;
    font-weight: 700; cursor: pointer; width: 100%; }
  .save-btn:hover { background: #357abd; }

  .loading { display: inline-block; width: 14px; height: 14px;
    border: 2px solid #ccc; border-top-color: #4a90d9;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <h1 id="app-title">AIプロンプトビルダー</h1>
  <div class="header-btns">
    <button class="profile-btn" onclick="openProfile()">共通プロフィール</button>
    <button onclick="openHistory()">履歴</button>
    <button onclick="openFavorites()">お気に入り</button>
    <button onclick="openSettings()">設定</button>
    <button id="lang-btn" onclick="toggleLang()">EN</button>
  </div>
</div>

<!-- タブ -->
<div class="tabs" id="tab-bar"></div>

<!-- メイン -->
<div class="main">
  <!-- 左：入力フォーム -->
  <div class="card">
    <div class="profile-badge" id="profile-badge" style="display:none;">
      <span id="profile-badge-text"></span>
      <button class="profile-badge-edit" onclick="openProfile()">編集</button>
    </div>

    <div class="form-title" id="form-title">AI-PM</div>

    <div class="preset-bar">
      <select class="preset-select" id="preset-select" onchange="onPresetSelect()">
        <option value="">-- プリセットを選択 --</option>
      </select>
      <button class="preset-btn preset-btn-save" onclick="saveCurrentAsPreset()">+ 保存</button>
      <button class="preset-btn preset-btn-del" onclick="deleteCurrentPreset()">削除</button>
    </div>

    <div class="form-scroll" id="form-area"></div>

    <div class="option-row">
      <input type="checkbox" id="send-to-api">
      <label for="send-to-api" id="send-option-label">Geminiに送信して回答を取得する</label>
    </div>
    <div class="option-row">
      <input type="checkbox" id="simple-mode" checked>
      <label for="simple-mode" id="simple-mode-label">追加質問モード（質問のみ送信）</label>
    </div>
    <button class="send-btn" id="send-btn" onclick="onSend()">プロンプトを生成</button>
  </div>

  <!-- 右：出力エリア -->
  <div class="card right-panel">
    <!-- プロンプトプレビュー（大きく） -->
    <div class="prompt-section">
      <div class="output-header">
        <span class="output-label" id="prompt-label">▼ 生成されたプロンプト</span>
        <div class="output-btns">
          <button class="output-btn" onclick="saveFavorite()">★ 保存</button>
          <button class="output-btn" id="copy-prompt-btn" onclick="copyPrompt()">プロンプトをコピー</button>
        </div>
      </div>
      <div class="output-box" id="prompt-box"></div>
    </div>

    <!-- 回答エリア -->
    <div class="answer-section">
      <div class="output-header">
        <span class="output-label" id="answer-label">▼ AIの回答</span>
        <button class="output-btn" id="copy-answer-btn" onclick="copyAnswer()">回答をコピー</button>
      </div>
      <div class="output-box answer-box" id="answer-box"></div>
    </div>
  </div>
</div>

<div class="status-bar" id="status-bar"></div>

<!-- 共通プロフィールモーダル -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal profile-modal">
    <div class="modal-header">
      <h2>共通プロフィール</h2>
      <button class="modal-close" onclick="closeModal('profile-modal')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:#888;margin-bottom:14px;">
        ここに入力した情報は全カテゴリのプロンプトに自動で付加されます。</p>
      <div id="profile-fields-area"></div>
      <hr class="profile-divider">
      <p style="font-size:12px;font-weight:600;color:#555;margin-bottom:8px;">
        カスタムフィールドを追加</p>
      <div class="add-custom-row">
        <input class="add-custom-input" id="custom-label-input"
               placeholder="ラベル名（例: 得意分野）">
        <button class="btn-add-custom" onclick="addCustomField()">+ 追加</button>
      </div>
      <button class="profile-save-btn" onclick="saveProfile()">保存</button>
    </div>
  </div>
</div>

<!-- 履歴モーダル -->
<div class="modal-overlay" id="history-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>履歴</h2>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn-danger" onclick="clearAllHistory()">全削除</button>
        <button class="modal-close" onclick="closeModal('history-modal')">✕</button>
      </div>
    </div>
    <div class="modal-body" id="history-body"></div>
  </div>
</div>

<!-- お気に入りモーダル -->
<div class="modal-overlay" id="favorites-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>お気に入り</h2>
      <button class="modal-close" onclick="closeModal('favorites-modal')">✕</button>
    </div>
    <div class="modal-body" id="favorites-body"></div>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal" style="width:520px;">
    <div class="modal-header">
      <h2>設定</h2>
      <button class="modal-close" onclick="closeModal('settings-modal')">✕</button>
    </div>
    <div class="settings-body">
      <!-- プロバイダー選択タブ -->
      <div class="settings-label">AIプロバイダー</div>
      <div class="provider-tabs">
        <button class="provider-tab active" id="tab-gemini"
                onclick="switchProvider('gemini')">Gemini</button>
        <button class="provider-tab" id="tab-openai"
                onclick="switchProvider('openai')">OpenAI</button>
      </div>

      <!-- Gemini設定 -->
      <div class="provider-section active" id="section-gemini">
        <div class="settings-label">Gemini APIキー</div>
        <input type="password" id="gemini-api-key-input" class="settings-input"
               placeholder="AIza...">
        <div class="settings-label">モデル</div>
        <div class="radio-group" id="gemini-model-group"></div>
      </div>

      <!-- OpenAI設定 -->
      <div class="provider-section" id="section-openai">
        <div class="settings-label">OpenAI APIキー</div>
        <input type="password" id="openai-api-key-input" class="settings-input"
               placeholder="sk-...">
        <div class="settings-label">モデル</div>
        <div class="radio-group" id="openai-model-group"></div>
      </div>

      <button class="save-btn" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────
// 状態管理
// ────────────────────────────────────────────
let lang = "ja";
let currentCategory = "ai_pm";
let generatedPrompt = "";
let currentProfile = {};
let profileFields = [];
let currentProvider = "gemini";

const UI = {
  ja: {
    title: "AIプロンプトビルダー", send: "送信",
    promptOnly: "プロンプトを生成",
    promptLabel: "▼ 生成されたプロンプト",
    answerLabel: "▼ AIの回答",
    copyPrompt: "プロンプトをコピー", copyAnswer: "回答をコピー",
    loading: "AIに送信中...", done: "完了", langBtn: "EN",
    sendOption: "AIに送信して回答を取得する",
    simpleMode: "追加質問モード（質問のみ送信）",
    errorEmpty: "必須項目を入力してください",
    presetPlaceholder: "-- プリセットを選択 --",
  },
  en: {
    title: "AI Prompt Builder", send: "Send",
    promptOnly: "Generate Prompt",
    promptLabel: "▼ Generated Prompt",
    answerLabel: "▼ AI Answer",
    copyPrompt: "Copy Prompt", copyAnswer: "Copy Answer",
    loading: "Sending to AI...", done: "Done", langBtn: "JA",
    sendOption: "Send to AI and get answer",
    simpleMode: "Follow-up mode (question only)",
    errorEmpty: "Please fill in required fields",
    presetPlaceholder: "-- Select Preset --",
  }
};

const CATEGORIES = {
  ja: ["AI-PM", "コード", "生活・健康", "大学勉強", "その他"],
  en: ["AI-PM", "Code", "Health & Life", "Study", "Other"],
};
const CAT_KEY_MAP = {
  "AI-PM": "ai_pm", "コード": "code", "Code": "code",
  "生活・健康": "health", "Health & Life": "health",
  "大学勉強": "study", "Study": "study",
  "その他": "other", "Other": "other",
};
const CAT_LABELS = {
  ai_pm:  { ja: "AI-PM",      en: "AI-PM" },
  code:   { ja: "コード",     en: "Code" },
  health: { ja: "生活・健康", en: "Health & Life" },
  study:  { ja: "大学勉強",   en: "Study" },
  other:  { ja: "その他",     en: "Other" },
};

// ────────────────────────────────────────────
// 初期化
// ────────────────────────────────────────────
window.onload = async () => {
  await loadProfileData();
  buildTabs();
  await loadCategory(currentCategory);
  await refreshPresets();
  await loadSettingsUI();
  updateSendBtn();
};

// ────────────────────────────────────────────
// タブ
// ────────────────────────────────────────────
function buildTabs() {
  const bar = document.getElementById("tab-bar");
  bar.innerHTML = "";
  CATEGORIES[lang].forEach(name => {
    const key = CAT_KEY_MAP[name];
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (key === currentCategory ? " active" : "");
    btn.textContent = name;
    btn.onclick = () => onTabClick(key);
    bar.appendChild(btn);
  });
}

async function onTabClick(key) {
  currentCategory = key;
  buildTabs();
  await loadCategory(key);
  await refreshPresets();
  clearOutputs();
}

// ────────────────────────────────────────────
// カテゴリ読み込み
// ────────────────────────────────────────────
async function loadCategory(key) {
  const res = await fetch(`/api/fields?category=${key}&lang=${lang}`);
  const data = await res.json();
  document.getElementById("form-title").textContent = CAT_LABELS[key][lang];
  const area = document.getElementById("form-area");
  area.innerHTML = "";

  data.fields.forEach(([fieldKey, label, placeholder, required]) => {
    const lbl = document.createElement("div");
    lbl.className = "field-label";
    lbl.textContent = label;
    area.appendChild(lbl);

    const isMulti = ["question", "error", "background", "goal"].includes(fieldKey);
    const input = document.createElement("textarea");
    input.className = "field-input placeholder";
    input.rows = isMulti ? 3 : 2;
    input.value = placeholder;
    input.dataset.placeholder = placeholder;
    input.dataset.fieldKey = fieldKey;
    input.dataset.required = required;

    input.addEventListener("focus", () => {
      if (input.value === placeholder) {
        input.value = "";
        input.classList.remove("placeholder");
      }
    });
    input.addEventListener("blur", () => {
      if (!input.value.trim()) {
        input.value = placeholder;
        input.classList.add("placeholder");
      }
    });
    area.appendChild(input);
  });
}

// ────────────────────────────────────────────
// 送信ボタン表示更新
// ────────────────────────────────────────────
function updateSendBtn() {
  const sendToApi = document.getElementById("send-to-api").checked;
  const ui = UI[lang];
  document.getElementById("send-btn").textContent =
    sendToApi ? ui.send : ui.promptOnly;
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("send-to-api").addEventListener("change", updateSendBtn);
});

// ────────────────────────────────────────────
// 共通プロフィール
// ────────────────────────────────────────────
async function loadProfileData() {
  const res = await fetch("/api/profile");
  const data = await res.json();
  currentProfile = data.profile;
  profileFields = data.fields;
  updateProfileBadge();
}

function updateProfileBadge() {
  const badge = document.getElementById("profile-badge");
  const text = document.getElementById("profile-badge-text");
  const filled = profileFields.filter(([key]) =>
    !key.startsWith("_") && currentProfile[key]
  );
  if (filled.length > 0) {
    const preview = filled.slice(0, 3)
      .map(([key, label]) => `${label}: ${currentProfile[key]}`)
      .join(" / ");
    text.textContent = "プロフィール設定済み: " + preview +
      (filled.length > 3 ? " ..." : "");
    badge.style.display = "flex";
  } else {
    badge.style.display = "none";
  }
}

async function openProfile() {
  await loadProfileData();
  renderProfileFields();
  document.getElementById("profile-modal").classList.add("open");
}

function renderProfileFields() {
  const area = document.getElementById("profile-fields-area");
  area.innerHTML = "";
  profileFields.forEach(([key, label]) => {
    if (key === "_custom_fields") return;
    const row = document.createElement("div");
    row.className = "profile-field-row";
    const lbl = document.createElement("div");
    lbl.className = "profile-field-label";
    lbl.textContent = label;
    const inp = document.createElement("input");
    inp.className = "profile-field-input";
    inp.type = "text";
    inp.dataset.key = key;
    inp.value = currentProfile[key] || "";
    inp.placeholder = label;
    const isCustom = !["name","role","org","experience","note"].includes(key);
    if (isCustom) {
      const delBtn = document.createElement("button");
      delBtn.className = "custom-field-del";
      delBtn.textContent = "✕";
      delBtn.onclick = () => deleteCustomField(key);
      const wrapper = document.createElement("div");
      wrapper.className = "custom-field-row";
      wrapper.appendChild(inp);
      wrapper.appendChild(delBtn);
      row.appendChild(lbl);
      row.appendChild(wrapper);
    } else {
      row.appendChild(lbl);
      row.appendChild(inp);
    }
    area.appendChild(row);
  });
}

async function addCustomField() {
  const labelInput = document.getElementById("custom-label-input");
  const label = labelInput.value.trim();
  if (!label) { setStatus("ラベル名を入力してください"); return; }
  const key = "custom_" + Date.now();
  await fetch("/api/add_profile_field", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key, label })
  });
  labelInput.value = "";
  await loadProfileData();
  renderProfileFields();
  setStatus("フィールドを追加しました");
}

async function deleteCustomField(key) {
  if (!confirm("このカスタムフィールドを削除しますか？")) return;
  await fetch("/api/delete_profile_field", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key })
  });
  await loadProfileData();
  renderProfileFields();
  setStatus("フィールドを削除しました");
}

async function saveProfile() {
  const inputs = document.querySelectorAll(".profile-field-input");
  const profile = {};
  if (currentProfile._custom_fields) {
    profile._custom_fields = currentProfile._custom_fields;
  }
  inputs.forEach(inp => {
    profile[inp.dataset.key] = inp.value.trim();
  });
  await fetch("/api/save_profile", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ profile })
  });
  currentProfile = profile;
  updateProfileBadge();
  closeModal("profile-modal");
  setStatus("プロフィールを保存しました");
}

// ────────────────────────────────────────────
// プリセット
// ────────────────────────────────────────────
async function refreshPresets() {
  const res = await fetch(`/api/presets?category=${currentCategory}`);
  const data = await res.json();
  const sel = document.getElementById("preset-select");
  const ui = UI[lang];
  sel.innerHTML = `<option value="">${ui.presetPlaceholder}</option>`;
  data.presets.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name;
    opt.dataset.fields = JSON.stringify(p.fields);
    sel.appendChild(opt);
  });
}

function onPresetSelect() {
  const sel = document.getElementById("preset-select");
  const selected = sel.options[sel.selectedIndex];
  if (!selected.value) return;
  const fields = JSON.parse(selected.dataset.fields);
  document.querySelectorAll(".field-input").forEach(input => {
    const key = input.dataset.fieldKey;
    if (fields[key] !== undefined && fields[key] !== "") {
      input.value = fields[key];
      input.classList.remove("placeholder");
    }
  });
  setStatus("プリセットを読み込みました");
}

async function saveCurrentAsPreset() {
  const name = prompt("プリセット名を入力してください:", "");
  if (!name || !name.trim()) return;
  const fields = {};
  document.querySelectorAll(".field-input").forEach(input => {
    fields[input.dataset.fieldKey] =
      input.classList.contains("placeholder") ? "" : input.value.trim();
  });
  await fetch("/api/save_preset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category: currentCategory, name: name.trim(), fields })
  });
  await refreshPresets();
  setStatus("プリセット「" + name.trim() + "」を保存しました");
}

async function deleteCurrentPreset() {
  const sel = document.getElementById("preset-select");
  const presetId = sel.value;
  const presetName = sel.options[sel.selectedIndex]?.textContent;
  if (!presetId) { setStatus("削除するプリセットを選択してください"); return; }
  if (!confirm(`「${presetName}」を削除しますか？`)) return;
  await fetch("/api/delete_preset", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category: currentCategory, preset_id: presetId })
  });
  await refreshPresets();
  setStatus("プリセットを削除しました");
}

// ────────────────────────────────────────────
// 送信
// ────────────────────────────────────────────
async function onSend() {
  const ui = UI[lang];
  const inputs = document.querySelectorAll(".field-input");
  const userInputs = {};
  let valid = true;

  inputs.forEach(inp => {
    const key = inp.dataset.fieldKey;
    const val = inp.classList.contains("placeholder") ? "" : inp.value.trim();
    userInputs[key] = val;
    if (inp.dataset.required === "true" && !val) valid = false;
  });

  if (!valid) { setStatus(ui.errorEmpty); return; }

  const simpleMode = document.getElementById("simple-mode").checked;

  const res = await fetch("/api/build_prompt", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      category: currentCategory, lang,
      user_inputs: userInputs, profile: currentProfile,
      simple_mode: simpleMode
    })
  });
  const data = await res.json();
  generatedPrompt = data.prompt;
  document.getElementById("prompt-box").textContent = generatedPrompt;

  await fetch("/api/save_history", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      category: currentCategory, lang,
      prompt: generatedPrompt, answer: ""
    })
  });

  const sendToApi = document.getElementById("send-to-api").checked;
  if (!sendToApi) { setStatus("プロンプトを生成しました"); return; }

  setStatus('<span class="loading"></span>' + ui.loading, true);
  const btn = document.getElementById("send-btn");
  btn.disabled = true;

  try {
    const gRes = await fetch("/api/ask_ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: generatedPrompt })
    });
    const gData = await gRes.json();
    if (gData.error) {
      setStatus("エラー: " + gData.error);
    } else {
      document.getElementById("answer-box").textContent = gData.answer;
      setStatus(ui.done);
    }
  } catch (e) {
    setStatus("通信エラー: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

// ────────────────────────────────────────────
// 言語切り替え
// ────────────────────────────────────────────
function toggleLang() {
  lang = lang === "ja" ? "en" : "ja";
  const ui = UI[lang];
  document.getElementById("app-title").textContent = ui.title;
  document.getElementById("lang-btn").textContent = ui.langBtn;
  document.getElementById("prompt-label").textContent = ui.promptLabel;
  document.getElementById("answer-label").textContent = ui.answerLabel;
  document.getElementById("copy-prompt-btn").textContent = ui.copyPrompt;
  document.getElementById("copy-answer-btn").textContent = ui.copyAnswer;
  document.getElementById("send-option-label").textContent = ui.sendOption;
  document.getElementById("simple-mode-label").textContent = ui.simpleMode;
  updateSendBtn();
  buildTabs();
  loadCategory(currentCategory);
  refreshPresets();
  clearOutputs();
}

// ────────────────────────────────────────────
// 設定（プロバイダー切り替え）
// ────────────────────────────────────────────
function switchProvider(provider) {
  currentProvider = provider;
  document.querySelectorAll(".provider-tab").forEach(t =>
    t.classList.remove("active"));
  document.querySelectorAll(".provider-section").forEach(s =>
    s.classList.remove("active"));
  document.getElementById("tab-" + provider).classList.add("active");
  document.getElementById("section-" + provider).classList.add("active");
}

async function loadSettingsUI() {
  const res = await fetch("/api/settings");
  const data = await res.json();

  document.getElementById("gemini-api-key-input").value = data.api_key || "";
  document.getElementById("openai-api-key-input").value = data.openai_api_key || "";

  const geminiGroup = document.getElementById("gemini-model-group");
  geminiGroup.innerHTML = "";
  data.gemini_models.forEach(m => {
    const item = document.createElement("label");
    item.className = "radio-item";
    item.innerHTML = `<input type="radio" name="gemini-model" value="${m}" ${m === data.model ? "checked" : ""}> ${m}`;
    geminiGroup.appendChild(item);
  });

  const openaiGroup = document.getElementById("openai-model-group");
  openaiGroup.innerHTML = "";
  data.openai_models.forEach(m => {
    const item = document.createElement("label");
    item.className = "radio-item";
    item.innerHTML = `<input type="radio" name="openai-model" value="${m}" ${m === data.openai_model ? "checked" : ""}> ${m}`;
    openaiGroup.appendChild(item);
  });

  switchProvider(data.provider || "gemini");
}

function openSettings() {
  loadSettingsUI();
  document.getElementById("settings-modal").classList.add("open");
}

async function saveSettings() {
  const geminiKey = document.getElementById("gemini-api-key-input").value.trim();
  const openaiKey = document.getElementById("openai-api-key-input").value.trim();
  const geminiModel = document.querySelector('input[name="gemini-model"]:checked')
                      ?.value || "gemini-2.5-flash";
  const openaiModel = document.querySelector('input[name="openai-model"]:checked')
                      ?.value || "gpt-4o-mini";
  await fetch("/api/save_settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      api_key: geminiKey,
      openai_api_key: openaiKey,
      model: geminiModel,
      openai_model: openaiModel,
      provider: currentProvider
    })
  });
  closeModal("settings-modal");
  setStatus("設定を保存しました");
}

// ────────────────────────────────────────────
// コピー
// ────────────────────────────────────────────
function copyPrompt() {
  if (!generatedPrompt) return;
  navigator.clipboard.writeText(generatedPrompt);
  setStatus("コピーしました");
}
function copyAnswer() {
  const text = document.getElementById("answer-box").textContent;
  if (!text) return;
  navigator.clipboard.writeText(text);
  setStatus("コピーしました");
}

// ────────────────────────────────────────────
// お気に入り保存
// ────────────────────────────────────────────
async function saveFavorite() {
  if (!generatedPrompt) { setStatus("先にプロンプトを生成してください"); return; }
  const title = prompt("タイトルを入力してください（省略可）:", "");
  if (title === null) return;
  await fetch("/api/save_favorite", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      category: currentCategory, lang, prompt: generatedPrompt, title
    })
  });
  setStatus("お気に入りに保存しました");
}

// ────────────────────────────────────────────
// 履歴
// ────────────────────────────────────────────
async function openHistory() {
  const res = await fetch("/api/history");
  const data = await res.json();
  const body = document.getElementById("history-body");
  body.innerHTML = "";
  if (!data.history.length) {
    body.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">履歴がありません</p>';
  } else {
    data.history.forEach(entry => {
      const card = document.createElement("div");
      card.className = "history-card";
      const preview = entry.prompt.slice(0, 100).split("\n").join(" ") + "...";
      const encoded = encodeURIComponent(entry.prompt);
      card.innerHTML = '<div class="history-meta"><span>[' + entry.category.toUpperCase() + '] ' + entry.timestamp + '</span><div class="history-meta-btns"><button class="btn-use" onclick="usePrompt(\'' + encoded + '\')">プロンプトを使う</button><button class="btn-delete" onclick="deleteHistoryEntry(\'' + entry.id + '\')">削除</button></div></div><div class="history-preview">' + preview + '</div>';
      body.appendChild(card);
    });
  }
  document.getElementById("history-modal").classList.add("open");
}

async function deleteHistoryEntry(id) {
  await fetch(`/api/delete_history/${id}`, { method: "DELETE" });
  openHistory();
}
async function clearAllHistory() {
  if (!confirm("履歴を全て削除しますか？")) return;
  await fetch("/api/clear_history", { method: "DELETE" });
  openHistory();
}

// ────────────────────────────────────────────
// お気に入り
// ────────────────────────────────────────────
async function openFavorites() {
  const res = await fetch("/api/favorites");
  const data = await res.json();
  const body = document.getElementById("favorites-body");
  body.innerHTML = "";
  if (!data.favorites.length) {
    body.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">お気に入りがありません</p>';
  } else {
    data.favorites.forEach(fav => {
      const card = document.createElement("div");
      card.className = "history-card";
      const encoded = encodeURIComponent(fav.prompt);
      card.innerHTML = '<div class="history-meta"><span>[' + fav.category.toUpperCase() + '] ' + fav.timestamp + '</span><div class="history-meta-btns"><button class="btn-use" onclick="usePrompt(\'' + encoded + '\')">プロンプトを使う</button><button class="btn-delete" onclick="deleteFavoriteEntry(\'' + fav.id + '\')">削除</button></div></div><div class="history-preview"><strong>' + (fav.title || '') + '</strong></div>';
      body.appendChild(card);
    });
  }
  document.getElementById("favorites-modal").classList.add("open");
}

async function deleteFavoriteEntry(id) {
  await fetch(`/api/delete_favorite/${id}`, { method: "DELETE" });
  openFavorites();
}

function usePrompt(encoded) {
  generatedPrompt = decodeURIComponent(encoded);
  document.getElementById("prompt-box").textContent = generatedPrompt;
  closeModal("history-modal");
  closeModal("favorites-modal");
  setStatus("プロンプトを読み込みました");
}

// ────────────────────────────────────────────
// ユーティリティ
// ────────────────────────────────────────────
function closeModal(id) {
  document.getElementById(id).classList.remove("open");
}
function clearOutputs() {
  document.getElementById("prompt-box").textContent = "";
  document.getElementById("answer-box").textContent = "";
  generatedPrompt = "";
  setStatus("");
}
function setStatus(html, isHtml = false) {
  const bar = document.getElementById("status-bar");
  if (isHtml) bar.innerHTML = html;
  else bar.textContent = html;
}
</script>
